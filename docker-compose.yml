services:
  # MongoDB Replica Set (Single node replica set for transactions)
  mongo:
    image: mongo:7.0
    container_name: metriflow-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --port 27017 --eval "
          try {
            rs.status();
          } catch (err) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: '127.0.0.1:27017' }]
            });
          }
        "
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Redis for BullMQ & Caching
  redis:
    image: redis:7-alpine
    container_name: metriflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Backend REST API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: metriflow-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/MetriFlowProd?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - API_BASE_URL=http://localhost:5000
      - CLIENT_URL=http://localhost
      - SESSION_SECRET=metriflow_super_secure_production_secret_key_32chars_min
      - SESSION_TTL_HOURS=12
      - STORAGE_DRIVER=local
      - EMAIL_ADAPTER=console
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Asynchronous Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: metriflow-worker
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/MetriFlowProd?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - STORAGE_DRIVER=local
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Frontend Web Client (React + Nginx)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: metriflow-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
